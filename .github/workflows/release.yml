# UMO Release: Sobald sich im Ordner extension/ die Version in manifest.json ändert,
# baut dieser Ablauf das Paket, veröffentlicht ein GitHub-Release und (optional) den Chrome Web Store.
name: UMO Release

on:
  push:
    branches: [main]
    paths: ["extension/**", "installer/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISH_TARGET: ${{ vars.CWS_PUBLISH_TARGET || 'trustedTesters' }}
      # Wohin die Releases gehen. Standard: dieses Repository.
      # Bleibt der Code privat: öffentliches Repository anlegen, als Variable RELEASE_REPO eintragen
      # und einen Token mit Schreibrecht darauf als Secret RELEASE_TOKEN hinterlegen.
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Version lesen
        id: v
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$RELEASE_REPO" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Hinweis, wenn sich die Version nicht geändert hat
        if: steps.v.outputs.exists == 'true'
        run: echo "Version ${{ steps.v.outputs.version }} gibt es schon. Für ein Update die Version in extension/manifest.json erhöhen."

      - name: Pakete bauen
        if: steps.v.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          REPO="$RELEASE_REPO"
          mkdir -p dist
          BASE="https://github.com/$REPO/releases"
          jq --arg u "$BASE/latest/download/version.json" '.updateManifestUrl = $u' extension/umo-config.json > cfg.tmp && mv cfg.tmp extension/umo-config.json
          (cd extension && zip -qr ../dist/umo-extension.zip . -x '*.DS_Store')
          NOTES=$(git log -1 --pretty=%s)
          jq -n --arg v "$VERSION" --arg z "$BASE/download/v$VERSION/umo-extension.zip" --arg n "$NOTES" '{version: $v, zip: $z, notes: $n}' > dist/version.json
          sed "s#__REPO__#$REPO#g" installer/install-mac.sh > dist/install-mac.sh
          sed "s#__REPO__#$REPO#g" installer/install-windows.ps1 > dist/install-windows.ps1
          cp installer/update-umo.sh dist/update-umo.sh
          cat dist/version.json

      - name: GitHub-Release veröffentlichen
        if: steps.v.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/umo-extension.zip dist/version.json dist/install-mac.sh dist/install-windows.ps1 dist/update-umo.sh \
            --repo "$RELEASE_REPO" --title "UMO $VERSION" --notes "$(git log -1 --pretty=%B)" --latest

      - name: Chrome Web Store (nur wenn Zugangsdaten hinterlegt sind)
        if: steps.v.outputs.exists == 'false' && env.CWS_EXTENSION_ID != ''
        run: |
          set -euo pipefail
          # Chrome Web Store Publish API v1.1: https://developer.chrome.com/docs/webstore/api
          TOKEN=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          # Für den Store ohne eigene Update-Adresse: dort aktualisiert Chrome selbst.
          (cd extension && jq '.updateManifestUrl = ""' umo-config.json > c.tmp && mv c.tmp umo-config.json && zip -qr ../dist/umo-store.zip . -x '*.DS_Store')
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -X PUT \
            -T dist/umo-store.zip "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" | tee upload.json
          jq -e '.uploadState == "SUCCESS" or .uploadState == "IN_PROGRESS"' upload.json
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish?publishTarget=$CWS_PUBLISH_TARGET"
