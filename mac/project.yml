name: UMO
options:
  bundleIdPrefix: studio.ysi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: <Team-ID eintragen>
targets:
  UMO:
    type: application
    platform: macOS
    sources:
      - path: UMO
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    entitlements:
      path: UMO/UMO.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    info:
      path: UMO/Info.plist
      properties:
        CFBundleDisplayName: UMO
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: "UMO liest das Dokument oder die E-Mail, die du gerade offen hast, damit es sie dir erklären kann. UMO schickt oder ändert dabei nichts."
        NSHumanReadableCopyright: "Studio Y-si"
        SUFeedURL: "https://github.com/lukaswimmerY-si/umo/releases/latest/download/appcast.xml"
        NSServices:
          - NSMenuItem:
              default: "Mit UMO vereinfachen"
            NSMessage: simplifyText
            NSPortName: UMO
            NSSendTypes: [NSStringPboardType]
  UMOTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: UMO
